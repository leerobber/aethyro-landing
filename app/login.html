<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log in — Aethyro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./style.css"/>
</head>
<body>
<div class="wrap">
  <a href="/" class="brand"><span class="dot"></span> Aethyro</a>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your Aethyro account.</p>
    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@company.com" autocomplete="email"/>
      <label for="password">Password</label>
      <input id="password" type="password" required placeholder="your password" autocomplete="current-password"/>
      <button class="btn" id="submit" type="submit">Log in →</button>
    </form>
    <div class="msg" id="msg"></div>
    <p class="alt">No account yet? <a href="./signup.html">Start a free trial</a></p>
  </div>
</div>
<script type="module">
import { supabase } from "./config.js";
const form=document.getElementById('form'), btn=document.getElementById('submit'), msg=document.getElementById('msg');
// already logged in? go to dashboard
(async()=>{ const { data:{session} } = await supabase.auth.getSession(); if(session) location.href='./dashboard.html'; })();
form.addEventListener('submit', async e=>{
  e.preventDefault(); btn.disabled=true; btn.textContent='Logging in…'; msg.className='msg';
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ msg.textContent=error.message; msg.className='msg show err'; btn.disabled=false; btn.textContent='Log in →'; return; }
  location.href='./dashboard.html';
});
</script>
</body>
</html>
